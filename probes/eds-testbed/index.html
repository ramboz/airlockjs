    <meta name="experiment" content="hero-cta">
    <meta name="experiment-variants" content="/variant-b">

      content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none'; frame-src 'self' https:; require-trusted-types-for 'script';"

  <body>
    <header></header>
    <main>
      <div>
        <h1 id="hero-heading">Control headline: ship fast static sites</h1>

        <p><strong><a href="/signup">Get started free</a></strong></p>
      </div>
      <div>
        <h2>Second section</h2>
        <p>Below-the-fold content shared by all variants, decorated in the lazy phase.</p>

             worker round-trip while the page is alive (steady-state push → cta_engage),
             which the unload ring-tail flush cannot do — that is the worker-path proof.
             Distinct from the /signup outbound anchor (AC2's pushCritical fast path). -->
        <p><button id="cta-engage" type="button">See pricing</button></p>
      </div>
    </main>
    <footer></footer>
