# Hermetic CI — spec 007-04. Runs the deterministic, credential-free oracle
# (vitest unit suite + the ga4_mp_conformance contracts validator) plus the
# test:oracle gate-flip proof (007-01) on every push/PR. No secrets: the live
# GA4 /debug/mp/collect check (contracts/mp-live-check.mjs) is NOT run here —
# it needs measurement_id/api_secret and self-skips without an endpoint; the
# browser rigs (Playwright/Lighthouse, including the 07-02 isolation assert)
# are out of scope for this slice and land in 07-05.
name: ci

# Least privilege: this hermetic gate only reads the repo (07-04 craft review).
permissions:
  contents: read

# Cancel superseded runs on the same ref so a push+PR pair doesn't double-run
# to completion (07-04 craft review).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  hermetic-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # Key the npm cache on BOTH lockfiles so a contracts/ dep change
          # invalidates it too (07-04 craft review).
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Oracle gate-flip proof (ga4_mp_conformance)
        run: npm run test:oracle

      - name: Install contracts dependencies
        working-directory: contracts
        run: npm ci

      - name: Validate contracts (ga4_mp_conformance golden fixtures)
        working-directory: contracts
        run: npm run validate

  # Browser CI — spec 007-05. A SEPARATE job from hermetic-oracle (AC3): a
  # chromium-install failure or browser flake here must not block the fast
  # hermetic gate above. No `needs:` coupling to hermetic-oracle on purpose.
  #
  # Gates on three structural asserts (07-02 real-Worker isolation, UC-1
  # no-flicker + conformant exposure beacon, 018-01 active-markup sanitizer
  # boundary); reports the cwv_budget
  # statistical rigs as advisory (07-03) — continue-on-error, per the
  # slice's wiring caveat (cwv:budget exits 1 on an over-budget miss, and
  # its advisory nature lives in the CI step, not the script).
  browser-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: GATING — real-Worker isolation invariant (07-02)
        run: npm run rig:isolation

      - name: GATING — UC-1 no-flicker + conformant exposure beacon (005-01)
        run: npm run rig:uc1
        env:
          # A slow shared runner needs more headroom than local dev for the
          # airlock-boot wait + beacon poll (07-05 robustness pass;
          # rig/uc1.mjs defaults to the original 20000/8000ms locally).
          UC1_BOOT_TIMEOUT_MS: "60000"
          UC1_BEACON_TIMEOUT_MS: "20000"

      - name: GATING — active-markup sanitizer boundary (018-01)
        # The load-bearing security proof for spec 018-01: reserveSpace().
        # fill()'s DEFAULT write path strips on*/dangerous-URL/denylisted-
        # element vectors under the real EDS boilerplate CSP. This is a
        # Node/vitest-INELIGIBLE proof (Node has no DOMParser, and the
        # project deliberately ships no jsdom/happy-dom/linkedom — see
        # core/sanitize-html.js's header) — this step, not `npm test`, is the
        # actual security gate for this slice's load-bearing AC.
        run: npm run rig:sanitize

      - name: ADVISORY — cwv_budget (Lighthouse + INP delta + drain delivery, 07-03)
        # Advisory only (spec.md routing table) — cwv:budget exits 1 on a
        # budget miss, so continue-on-error is REQUIRED here or a statistical
        # drift would fail this job (07-05 wiring caveat). Do NOT add this to
        # the gating steps above.
        # `mkdir -p rig/out` decouples this from rig:uc1 having created the dir;
        # `tee` keeps the report visible in the Actions log AND uploaded as an
        # artifact (a human-readable text table — .txt, not JSON). GHA's default
        # `pipefail` preserves cwv:budget's exit code through the pipe, so an
        # over-budget miss still annotates the step (then continue-on-error keeps
        # the job green). 07-05 compliance/craft/arch review.
        continue-on-error: true
        run: mkdir -p rig/out && npm run cwv:budget | tee rig/out/cwv-report.txt

      - name: Upload rig artifacts (AC4 — scoreboard + challenger screenshot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-oracle-artifacts
          path: rig/out/
          if-no-files-found: warn
