<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Airlock nasty-tag INP rig (spec 023-01)</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 0; padding: 2rem; }
      #target { width: 240px; height: 80px; font-size: 18px; cursor: pointer; }
      #out { white-space: pre-wrap; margin-top: 1rem; color: #333; }
      #pool { display: flex; flex-wrap: wrap; max-width: 600px; }
      #pool div { width: 3px; height: 3px; margin: 1px; background: #ddd; }
    </style>
  </head>
  <body>
    <h1>Airlock nasty-tag INP rig (spec 023-01)</h1>
    <p>
      mode <b id="mode"></b> &middot; elements <b id="els"></b> &middot;
      work/element <b id="wk"></b>&micro;s &middot; budget <b id="bud"></b>ms
    </p>
    <button id="target">interact</button>
    <pre id="out"></pre>
    <div id="pool"></div>
    <script type="module">
      // ?mode=naive|airlock&elements=400&workUs=500&budgetMs=10&yield=platform|fallback
      //
      // The synthetic nasty tag (spec 023-01 AC3): a click handler that does
      // heavy CHUNKABLE DOM work — a per-element layout-read/style-write
      // thrash over a pre-collected node set. TWO MODES on this SAME fixture:
      // "naive" runs the loop synchronously (the common badly-coded-tag
      // shape); "airlock" runs the SAME per-element step over the SAME item
      // set through AC2's scheduled-DOM-op capability. No governance/egress
      // here — purely the main-thread-cost contrast (AC3).
      //
      // AC3 must-fix: the dominant cost is the CHUNKABLE per-element loop,
      // NOT the node-set collection. The collection (equivalent to a
      // querySelectorAll) runs EXACTLY ONCE, HERE, at load — before any
      // click, never inside the measured interaction. `collectMs` below is
      // the MEASURED cost of that one-time collection (reported in the
      // snapshot), confirming — not just asserting — that it is cheap and
      // off the interaction path (grounding probe: see this slice's
      // deviation log for the observed number).
      import { createScheduledDomCapability } from "../adapters/eds/scheduled-dom.js";

      const q = new URLSearchParams(location.search);
      const MODE = q.get("mode") || "naive";
      const ELEMENTS = Number(q.get("elements") || 400);
      const WORK_US = Number(q.get("workUs") || 500);
      const BUDGET_MS = Number(q.get("budgetMs") || 10);
      // "fallback" forces core/scheduler.js's MessageChannel path even where
      // the platform scheduler.yield/postTask primitives ARE available — so
      // the fallback is actually exercised end-to-end in a real browser too,
      // not just proven in a Node unit test (023-01 grounding probe).
      const YIELD = q.get("yield") || "platform";
      document.getElementById("mode").textContent = MODE;
      document.getElementById("els").textContent = ELEMENTS;
      document.getElementById("wk").textContent = WORK_US;
      document.getElementById("bud").textContent = BUDGET_MS;

      // --- fixture DOM: PRE-COLLECT the node set ONCE, at load, OUTSIDE any
      //     interaction (AC3 must-fix).
      const collectStart = performance.now();
      const pool = document.getElementById("pool");
      const frag = document.createDocumentFragment();
      for (let i = 0; i < ELEMENTS; i++) frag.appendChild(document.createElement("div"));
      pool.appendChild(frag);
      const items = Array.from(pool.querySelectorAll("div")); // the ONE collection, at load, off the interaction path
      const collectMs = performance.now() - collectStart;

      // --- the nasty per-element step: layout-thrash flavor (AC3) — a style
      //     WRITE immediately followed by a layout READ forces a synchronous
      //     reflow before the next element's write can be batched by the
      //     browser (the classic forced-layout-thrash pattern), PLUS a
      //     busy-spin (mirrors baseline/naive.js's `busy()` convention) so
      //     the per-element cost is a deterministic, controllable magnitude
      //     rather than left to vary with DOM size/machine alone.
      function busy(micros) {
        if (micros <= 0) return;
        const end = performance.now() + micros / 1000;
        while (performance.now() < end) {} // eslint-disable-line no-empty
      }
      let hue = 0;
      function nastyStep(el) {
        hue = (hue + 1) % 3;
        el.style.transform = "translateY(" + hue + "px)"; // WRITE
        void el.offsetHeight; // READ — forces sync layout (the thrash)
        busy(WORK_US);
      }

      // --- runtime under test: naive (synchronous) vs airlock (AC2's
      //     scheduled-DOM-op capability).
      const forceFallbackDeps = YIELD === "fallback" ? { schedulerYield: null, schedulerPostTask: null } : {};
      const capability = createScheduledDomCapability({ budgetMs: BUDGET_MS, ...forceFallbackDeps });

      let workCompleted = 0;
      let clicksFired = 0;

      // --- INP-under-storm collector — VERBATIM from rig/harness.html:30-46
      //     (023-01 AC4: measure the repo's PROVEN way, a raw Event-Timing
      //     PerformanceObserver, NOT web-vitals onINP).
      const latencies = [];
      const seen = new Set();
      // ALL raw "event"-type entries (NOT deduped by interactionId) — kept
      // separately from `latencies` so the breakdown below can GROUP every
      // entry sharing an interactionId (see that function's header for why
      // a single first-seen entry is not enough).
      const rawEntries = [];
      new PerformanceObserver((list) => {
        for (const e of list.getEntries()) {
          if (!e.interactionId) continue;
          rawEntries.push(e);
          if (!seen.has(e.interactionId)) { seen.add(e.interactionId); latencies.push(e.duration); }
        }
      }).observe({ type: "event", durationThreshold: 16, buffered: true });
      new PerformanceObserver((list) => {
        for (const e of list.getEntries()) {
          const key = "fi" + (e.interactionId ?? 0);
          if (!seen.has(key)) { seen.add(key); latencies.push(e.duration); }
        }
      }).observe({ type: "first-input", buffered: true });

      document.getElementById("target").addEventListener("click", () => {
        clicksFired++;
        if (MODE === "airlock") {
          // Fire-and-forget from the handler's perspective — exactly how a
          // real tag kicks off work and returns control to the browser.
          capability.runScheduled(items, nastyStep).then(({ completed }) => { workCompleted += completed; });
        } else {
          for (let i = 0; i < items.length; i++) nastyStep(items[i]);
          workCompleted += items.length;
        }
      });

      const pct = (arr, p) => {
        if (!arr.length) return 0;
        const s = [...arr].sort((a, b) => a - b);
        return s[Math.min(s.length - 1, Math.floor((p / 100) * s.length))];
      };
      const median = (arr) => {
        if (!arr.length) return 0;
        const s = [...arr].sort((a, b) => a - b);
        const m = Math.floor(s.length / 2);
        return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
      };

      // Naive INP breakdown (AC4): input-delay / processing / presentation.
      // A single click DISPATCHES SEVERAL discrete events sharing ONE
      // interactionId (pointerdown/mousedown/pointerup/mouseup/click — this
      // fixture only attaches a HEAVY handler to "click", so an EARLIER
      // event in the group, e.g. pointerdown, reports near-zero processing
      // of its own even though the group's overall duration reflects the
      // full wait behind click's heavy handler). A naive single-entry read
      // (an EARLIER draft of this file used exactly that — see this slice's
      // deviation log) therefore mis-attributes time to "presentation" that
      // is really the LATER click event's processing. The fix: GROUP every
      // raw entry by interactionId and take min(processingStart) /
      // max(processingEnd) across the group, mirroring web-vitals/
      // attribution's own onINP.js grouping + clamping
      // (node_modules/web-vitals/dist/modules/attribution/onINP.js:120-151,
      // 331-345 — this repo's prior grounding of that file is
      // connectors/helix-rum/cwv-capture.js's header):
      //   processingStart' = max(min(entry.processingStart), group.startTime)
      //   nextPaintTime     = max(group.startTime + max(entry.duration), processingStart')
      //   processingEnd'    = min(max(entry.processingEnd), nextPaintTime)
      //   inputDelay        = processingStart' - group.startTime
      //   processingDuration= processingEnd' - processingStart'
      //   presentationDelay = nextPaintTime - processingEnd'
      function breakdown() {
        const groups = new Map();
        for (const e of rawEntries) {
          if (typeof e.processingStart !== "number" || typeof e.processingEnd !== "number") continue;
          const g = groups.get(e.interactionId);
          if (!g) {
            groups.set(e.interactionId, {
              startTime: e.startTime, processingStart: e.processingStart, processingEnd: e.processingEnd, duration: e.duration,
            });
          } else {
            g.startTime = Math.min(g.startTime, e.startTime);
            g.processingStart = Math.min(g.processingStart, e.processingStart);
            g.processingEnd = Math.max(g.processingEnd, e.processingEnd);
            g.duration = Math.max(g.duration, e.duration);
          }
        }
        const inputDelay = [];
        const processing = [];
        const presentation = [];
        for (const g of groups.values()) {
          const processingStart = Math.max(g.processingStart, g.startTime);
          const nextPaintTime = Math.max(g.startTime + g.duration, processingStart);
          const processingEnd = Math.min(g.processingEnd, nextPaintTime);
          inputDelay.push(processingStart - g.startTime);
          processing.push(processingEnd - processingStart);
          presentation.push(nextPaintTime - processingEnd);
        }
        return {
          inputDelay_median: Math.round(median(inputDelay)),
          processing_median: Math.round(median(processing)),
          presentation_median: Math.round(median(presentation)),
          samples: inputDelay.length,
        };
      }

      window.__rig = {
        snapshot() {
          return {
            mode: MODE, elements: ELEMENTS, workUs: WORK_US, budgetMs: BUDGET_MS, yieldMode: YIELD,
            mechanism: capability.mechanism,
            collectMs: Math.round(collectMs * 100) / 100, // measured — confirms this never runs on the interaction path
            interactions: latencies.length,
            inp_p75: Math.round(pct(latencies, 75)),
            inp_p98: Math.round(pct(latencies, 98)),
            inp_max: Math.round(Math.max(0, ...latencies)),
            clicksFired,
            workCompleted,
            expectedWork: clicksFired * ELEMENTS,
            breakdown: breakdown(),
          };
        },
      };
      document.getElementById("out").textContent = "rig ready (" + MODE + ", " + ELEMENTS + " elements, collect=" + collectMs.toFixed(2) + "ms)";
    </script>
  </body>
</html>
