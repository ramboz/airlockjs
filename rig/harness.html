<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Airlock INP rig</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 0; padding: 2rem; }
      #target { width: 240px; height: 80px; font-size: 18px; cursor: pointer; }
      #out { white-space: pre-wrap; margin-top: 1rem; color: #333; }
    </style>
  </head>
  <body>
    <h1>Airlock INP measurement rig</h1>
    <p>mode <b id="mode"></b> · trackers <b id="tr"></b> · work/tracker <b id="wk"></b>µs</p>
    <button id="target">interact</button>
    <pre id="out"></pre>
    <script type="module">
      // ?mode=naive|deferred|worker&trackers=5&work=30000  (work = µs/tracker/interaction)
      const q = new URLSearchParams(location.search);
      const MODE = q.get("mode") || "naive";
      const TRACKERS = Number(q.get("trackers") || 5);
      const WORK = Number(q.get("work") || 30000);
      document.getElementById("mode").textContent = MODE;
      document.getElementById("tr").textContent = TRACKERS;
      document.getElementById("wk").textContent = WORK;

      const ctx = { clientId: "1234567890.1700000000", sessionId: "1724668790" };
      const endpoints = Array.from({ length: TRACKERS }, (_, i) => `https://t${i}.example/collect`);

      // --- INP-under-storm collector: per-interaction latency (Event Timing) ---
      const latencies = [];
      const seen = new Set();
      new PerformanceObserver((list) => {
        for (const e of list.getEntries()) {
          if (e.interactionId && !seen.has(e.interactionId)) {
            seen.add(e.interactionId);
            latencies.push(e.duration);
          }
        }
      }).observe({ type: "event", durationThreshold: 16, buffered: true });
      new PerformanceObserver((list) => {
        for (const e of list.getEntries()) {
          const key = "fi" + (e.interactionId ?? 0);
          if (!seen.has(key)) { seen.add(key); latencies.push(e.duration); }
        }
      }).observe({ type: "first-input", buffered: true });

      // --- runtime under test ---
      const factories = {
        naive: () => import("../baseline/naive.js").then((m) => m.createNaive),
        deferred: () => import("../baseline/patch-datalayer.js").then((m) => m.createDeferred),
        worker: () => import("../core/airlock.js").then((m) => m.createAirlock),
      };
      const create = await factories[MODE]();
      const runtime = create({ trackers: TRACKERS, workFactor: WORK, endpoints, ctx });

      // --- interaction handler: one event; the runtime routes it to T trackers ---
      let n = 0;
      document.getElementById("target").addEventListener("click", () => {
        runtime.push({ event: "spike_interaction", i: n++ });
      });

      const pct = (arr, p) => {
        if (!arr.length) return 0;
        const s = [...arr].sort((a, b) => a - b);
        return s[Math.min(s.length - 1, Math.floor((p / 100) * s.length))];
      };
      window.__rig = {
        snapshot() {
          runtime.flushNow?.();
          return {
            mode: MODE, trackers: TRACKERS, work_us: WORK,
            interactions: latencies.length,
            inp_p75: Math.round(pct(latencies, 75)),
            inp_p98: Math.round(pct(latencies, 98)),
            inp_max: Math.round(Math.max(0, ...latencies)),
            stats: runtime.stats?.() ?? {},
          };
        },
        // OQ10 teardown rig hooks: drive the two egress paths directly.
        push(ev) { runtime.push(ev); },                       // normal (worker round-trip)
        pushCritical(ev) { runtime.pushCritical?.(ev); },     // synchronous main-thread fast path
        stats() { return runtime.stats?.() ?? {}; },
      };
      document.getElementById("out").textContent = "rig ready (" + MODE + ", " + TRACKERS + " trackers)";
    </script>
  </body>
</html>
