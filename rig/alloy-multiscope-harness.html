<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Alloy multi-scope personalization — decisionScopes + N placements (spec 034-02)</title>
    <style>
      /* Born HIDDEN; first paint gated on `appear` (R-005 / uc1) so the eager
         reserve of EACH box (before appear) can never flicker. */
      html, body { margin: 0; padding: 0; }
      body { visibility: hidden; }
      #header { height: 120px; background: #eee; }
      #below { height: 80px; background: #ddd; }
      #hero { background: #cfe; }
      #recs { background: #fec; }
    </style>
  </head>
  <body>
    <div id="header">header (above the fold)</div>
    <!-- two eager-reserved personalization boxes: empty at reserve-time, filled lazily BY SCOPE -->
    <div id="hero"></div>
    <div id="recs"></div>
    <div id="below">sentinel below the boxes</div>

    <script type="module">
      // Spec 034-02 — multi-scope personalization end-to-end (AC5), extending the
      // 033-03 decisions rig to N scopes:
      //   - the chamber config carries decisionScopes: ["__view__","products"] (exactly
      //     what bootAlloy derives from placements[].scope), so REAL stock alloy@2.35.0
      //     requests BOTH scopes on the interact (the rig server asserts the request body
      //     carried both — the REQUEST wiring rig-proven against real alloy, not just
      //     source-grounded);
      //   - the stub Edge returns a per-scope proposition each (per-scope RESPONSE is
      //     server behavior — rig-proven with the stub; live-Alloy creds-gated, NOT claimed);
      //   - the host reserves BOTH boxes pre-paint (reservePersonalization) and fills EACH
      //     by scope (host-side scope→box map), reporting one proposition_display per scope.
      import { reservePersonalization } from "/adapters/eds/reserve-personalization.js";
      import { extractDecisions, htmlOfDecision } from "/connectors/alloy/decisions.js";
      import { createPropositionExposureReporter } from "/adapters/eds/decisions-exposure.js";
      import { createGenericCapture } from "/rig/generic-capture.js";

      const WORKER_URL = "/rig/out/alloy-multiscope.worker.built.js";
      const BUNDLE_URL = "/probes/alloy-worker/node_modules/@adobe/alloy/dist/alloy.js";
      const SCOPES = ["__view__", "products"];
      // The chamber config mirrors what bootAlloy passes: decisionScopes derived from
      // placements[].scope. This is what makes REAL alloy request both scopes.
      const CONFIG = { datastreamId: "00000000-0000-0000-0000-000000000000", orgId: "SPIKE@AdobeOrg", context: [], decisionScopes: SCOPES, debugEnabled: true };
      const EVENT = { seq: 1, type: "page_view", ts: 10, params: { page_location: "https://airlock.example/", page_title: "airlock" }, payload: {}, snapshot: {} };
      // Two placements (one per scope) — exactly as a production integrator authors them.
      const PERSONALIZATION_CONFIG = {
        connectors: [{ type: "alloy", bundleUrl: BUNDLE_URL, datastreamId: CONFIG.datastreamId, placements: [
          { scope: "__view__", selector: "#hero", minHeight: 300, prehide: true, timeout: 5000 },
          { scope: "products", selector: "#recs", minHeight: 200, prehide: true, timeout: 5000 },
        ] }],
      };

      window.__flicker = { events: [] };
      const mark = (name) => window.__flicker.events.push({ name, t: performance.now() });
      const markT = (name) => { const e = window.__flicker.events.find((x) => x.name === name); return e ? e.t : null; };
      const attrOf = (sel, a) => { const el = document.querySelector(sel); return el ? el.getAttribute(a) : null; };
      const fail = (message, extra) => { window.__ALLOY_MULTISCOPE_RESULT__ = { fatal: message, ...(extra || {}) }; };

      async function main() {
        mark("script:start");

        // ---- 1. EAGER reserve of BOTH boxes (BEFORE appear), via reservePersonalization ----
        mark("reserve:boxes");
        let reserved;
        try {
          const out = reservePersonalization(PERSONALIZATION_CONFIG);
          reserved = out.reservedPlacements;
        } catch (e) { return fail("reservePersonalization threw: " + (e && e.message)); }
        if (!reserved || !reserved["__view__"] || !reserved["products"]) {
          return fail("reservePersonalization did not reserve both scopes", { reservedScopes: reserved ? Object.keys(reserved) : null });
        }
        // Await the handles (sized synchronously already — this is pre-paint by construction).
        const handles = {};
        try {
          handles.__view__ = await reserved["__view__"];
          handles.products = await reserved["products"];
        } catch (e) { return fail("a reserved handle rejected: " + (e && e.message)); }
        const reserveHeroMinHeight = document.querySelector("#hero").style.minHeight;
        const reserveRecsMinHeight = document.querySelector("#recs").style.minHeight;

        // ---- 2. APPEAR — the paint gate (born hidden, reveal here) ----
        mark("body:appear");
        document.body.style.visibility = "visible";

        // ---- 3. LAZY: boot the alloy chamber, drive one event, get ALL decisions ----
        let decisions = null, chamberFatal = null;
        try { decisions = await runChamber(); } catch (e) { chamberFatal = String((e && e.message) || e); }
        if (chamberFatal) return fail("chamber: " + chamberFatal);
        if (!decisions || decisions.length < 2) return fail("expected a decision per scope from the chamber", { decisions });
        mark("decisions:received");

        // ---- 4. HOST-SIDE scope→box map: fill EACH box by its scope (never a raw write) ----
        const filledByScope = {};
        for (const scope of SCOPES) {
          const [decision] = extractDecisions({ propositions: decisions.map((d) => d.content || d) }, { scope });
          if (!decision) return fail("no decision for scope " + scope, { decisions });
          const html = htmlOfDecision(decision);
          if (!html) return fail("decision for scope " + scope + " carried no renderable html");
          handles[scope].fill(html);
          filledByScope[scope] = html;
        }
        mark("fill:boxes");

        // ---- 5. EXPOSURE per scope, routed through a COMPOSITE fan-out (AC4/AC5) ----
        const beaconPromises = [];
        const capture = createGenericCapture({
          beacon: (evt) => { beaconPromises.push(fetch("/airlock-exposure", { method: "POST", body: JSON.stringify(evt), keepalive: true }).catch(() => {})); },
        });
        const alloyReceivedExposure = [];
        const accepts = (voc, name) => voc.includes("*") || voc.includes(name);
        const compositePush = (evt) => {
          if (accepts(["page_view"], evt.event)) alloyReceivedExposure.push(evt); // alloy ignores proposition_display (no loop)
          if (accepts(["*"], evt.event)) capture.push(evt); // GA4 catch-all → generic capture
        };
        createPropositionExposureReporter({ push: compositePush }, { seen: new Set() })
          .reportAll(decisions.map((d) => d.content || d));
        capture.flush();
        await Promise.all(beaconPromises);

        window.__ALLOY_MULTISCOPE_RESULT__ = {
          marks: window.__flicker.events.map((e) => e.name),
          markTimes: { reserveBoxes: markT("reserve:boxes"), bodyAppear: markT("body:appear"), fillBoxes: markT("fill:boxes") },
          deliveredScopes: decisions.map((d) => (d.content ? d.content.scope : d.scope)),
          reserveHeroMinHeight, reserveRecsMinHeight,
          heroReservedAttr: attrOf("#hero", "data-airlock-reserved"),
          recsReservedAttr: attrOf("#recs", "data-airlock-reserved"),
          heroFilledAttr: attrOf("#hero", "data-airlock-filled"),
          recsFilledAttr: attrOf("#recs", "data-airlock-filled"),
          heroInnerHtml: document.querySelector("#hero").innerHTML,
          recsInnerHtml: document.querySelector("#recs").innerHTML,
          filledByScope,
          exposureBeaconsSent: capture.sent.slice(),
          exposureRoutedToAlloyCount: alloyReceivedExposure.length, // must be 0 (alloy ignores it)
          workerNoRealFetch: chamberSummary && chamberSummary.workerRealFetchCalls,
        };
      }

      // ---- the alloy chamber (single classic worker; mirror of the decisions harness) ----
      let chamberSummary = null;
      function reconcileForBrokerJar(raw) {
        return String(raw).split(";").map((s) => s.trim()).filter((seg) => {
          const s = seg.toLowerCase();
          return !s.startsWith("domain=") && s !== "secure" && !s.startsWith("samesite=");
        }).join("; ");
      }
      async function dispatchInterceptedFetch(worker, m) {
        let target = m.url;
        try { const u = new URL(m.url); target = u.pathname + u.search; } catch (e) {}
        try {
          const res = await fetch(target, { method: m.method || "POST", headers: m.headers || {}, body: m.body });
          const body = await res.text();
          worker.postMessage({ type: "intercepted-fetch-response", id: m.id, status: res.status, statusText: res.statusText, headers: { "content-type": res.headers.get("content-type") || "application/json" }, body });
        } catch (err) {
          worker.postMessage({ type: "intercepted-fetch-response", id: m.id, status: 0, statusText: String(err), body: "" });
        }
      }
      function runChamber() {
        return new Promise((resolve, reject) => {
          const worker = new Worker(WORKER_URL); // CLASSIC worker
          let delivered = null;
          worker.onmessage = (e) => {
            const m = e.data || {};
            if (m.type === "phase") {
              if (m.name === "configured") worker.postMessage({ type: "event", event: EVENT });
            } else if (m.type === "intercepted-fetch") {
              dispatchInterceptedFetch(worker, m);
            } else if (m.type === "cookie-writeback") {
              try { document.cookie = reconcileForBrokerJar(m.value); } catch (err) {}
            } else if (m.type === "decisions") {
              delivered = m.decisions; // ALL scopes' propositions crossed as DATA
            } else if (m.type === "result") {
              chamberSummary = m.summary;
              resolve(delivered);
            } else if (m.type === "fatal") {
              chamberSummary = m.summary;
              reject(new Error(m.message || "chamber fatal"));
            }
          };
          worker.onerror = (e) => reject(new Error("worker onerror: " + e.message));
          worker.postMessage({ type: "init", cookie: "", config: CONFIG, bundleUrl: BUNDLE_URL });
        });
      }

      main().catch((e) => fail("harness threw: " + ((e && e.stack) || e)));
    </script>
  </body>
</html>
